version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 22
        - mkdir -p .ci
        - git clone --depth 1 --branch 3.47.7 https://github.com/flutter/flutter.git .ci/flutter
        - export FLUTTER_BIN="$PWD/.ci/flutter/bin/flutter"
        - export PATH="$PWD/.ci/flutter/bin:$PATH"
        - export PUB_CACHE="$PWD/.pub-cache"
        - flutter --disable-analytics
        - flutter --version
        - flutter pub get --enforce-lockfile
    build:
      commands:
        - flutter analyze --no-pub
        - flutter test --no-pub
        - scripts/build-web.sh --no-pub
  artifacts:
    baseDirectory: build/web
    files:
      - '**/*'
  cache:
    paths:
      - .pub-cache/**/*
