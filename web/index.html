<!DOCTYPE html>
<html>

<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Timer for blind increases for private home poker games">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#2196F3">
  <meta name="apple-mobile-web-app-title" content="poker_timer">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>poker_timer</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* iOS 26+ PWA: an opaque fixed strip at the top (together with the
       "default" status bar style above) stops Safari drawing its status bar
       blur over the app. Must be a real element, not a ::before. */
    #ios-status-strip {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 12px;
      background: #2196F3;
      z-index: 2147483647;
      pointer-events: none;
    }
  </style>

</head>

<body>
  <div id="ios-status-strip"></div>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('flutter_service_worker.js')
          .catch(error => console.warn('Offline cache unavailable:', error));
      });
    }
  </script>
</body>

</html>
